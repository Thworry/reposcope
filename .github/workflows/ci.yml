name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.16.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm exec tsc -b
      - run: pnpm test:coverage
      - run: pnpm test:server
      - run: pnpm typecheck:server
      - run: pnpm check:deep-analysis-eval
      - run: pnpm build
        env:
          REPOSCOPE_API_ORIGIN: ${{ vars.REPOSCOPE_API_ORIGIN }}
      - run: pnpm check:bundle
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm check:lighthouse
